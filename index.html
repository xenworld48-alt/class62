  </div>


  <div id="status" class="notice" hidden></div>

  <div id="empty" class="empty" hidden>아직 학생이 없어요. 오른쪽 위 설정에서 관리 권한을 받은 뒤 첫 학생을 추가하세요.</div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
/* ---------- Supabase 저장소 ----------
   board_docs 표 하나에 (collection, id, data)로 저장한다.
   아래 db 객체는 페이지의 나머지 코드가 쓰는 collection()/doc()/onSnapshot 모양을 그대로 흉내 낸다. */
const SUPABASE_URL = 'https://pyjqvzvvnpsbsknayzgl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5anF2enZ2bnBzYnNrbmF5emdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjk4NjAsImV4cCI6MjEwNjkwNTg2MH0.r4EN-jaynVoKaGLbk8Mpe5zIIyyhnj5FhILRCGKfkqE';
function makeSupabaseDb(){
  if (!window.supabase || !window.supabase.createClient) return null;
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const T = 'board_docs';
  const cache = new Map();                 // collection -> Map(id -> data)
  const listeners = new Map();             // collection -> Set(fn)
  const errHandlers = new Set();
  let loaded = false, live = false;
  const col = c => { if (!cache.has(c)) cache.set(c, new Map()); return cache.get(c); };
  const snap = c => ({ docs: [...col(c)].map(([id, data]) => ({ id, exists: true, data: () => data })) });
  const fire = c => { if (loaded) (listeners.get(c) || []).forEach(fn => { try { fn(snap(c)); } catch (e) { console.error(e); } }); };
  const check = r => { if (r.error) throw r.error; return r; };
  const mintId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

  async function fetchAll(){
    const rows = []; const page = 1000;
    for (let from = 0; ; from += page){
      const r = check(await client.from(T).select('collection,id,data').order('collection').order('id').range(from, from + page - 1));
      rows.push(...r.data);
      if (r.data.length < page) break;
    }
    return rows;
  }
  async function refresh(){
    const rows = await fetchAll();
    const next = new Map();
    rows.forEach(r => { if (!next.has(r.collection)) next.set(r.collection, new Map()); next.get(r.collection).set(r.id, r.data || {}); });
    const names = new Set([...cache.keys(), ...next.keys(), ...listeners.keys()]);
    const first = !loaded; loaded = true;
    names.forEach(c => {
      const a = JSON.stringify([...col(c)]), b = JSON.stringify([...(next.get(c) || new Map())]);
      cache.set(c, next.get(c) || new Map());
      if (first || a !== b) fire(c);
    });
  }
  const start = refresh().catch(e => { console.error(e); errHandlers.forEach(fn => fn(e)); });

  // 실시간: 다른 기기에서 바뀐 내용이 바로 들어온다
  try {
    client.channel('board-docs')
      .on('postgres_changes', { event: '*', schema: 'public', table: T }, p => {
        if (!loaded) return;
        if (p.eventType === 'DELETE'){ const o = p.old || {}; if (o.collection && o.id){ col(o.collection).delete(o.id); fire(o.collection); } }
        else { const n = p.new || {}; if (n.collection && n.id){ col(n.collection).set(n.id, n.data || {}); fire(n.collection); } }
      })
      .subscribe(status => { live = status === 'SUBSCRIBED'; });
  } catch (e) { console.error(e); }
  // 안전망: 실시간이 끊겨 있으면 15초마다, 연결돼 있어도 2분마다 다시 읽는다
  let lastSync = Date.now();
  setInterval(() => {
    if (document.hidden) return;
    if (Date.now() - lastSync < (live ? 120000 : 15000)) return;
    lastSync = Date.now(); refresh().catch(e => console.error(e));
  }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastSync = Date.now(); refresh().catch(e => console.error(e)); } });

  const docRef = (c, id) => ({
    id, path: c + '/' + id,
    async set(data){ col(c).set(id, data); fire(c); check(await client.from(T).upsert({ collection: c, id, data, updated_at: new Date().toISOString() })); },
    async update(patch){
      await start;
      const cur = col(c).get(id); if (!cur) throw new Error('기록을 찾을 수 없어요. 새로고침한 뒤 다시 해 주세요.');
      const data = { ...cur, ...patch }; col(c).set(id, data); fire(c);
      check(await client.from(T).upsert({ collection: c, id, data, updated_at: new Date().toISOString() }));
    },
    async delete(){ col(c).delete(id); fire(c); check(await client.from(T).delete().eq('collection', c).eq('id', id)); }
  });
  return {
    collection: c => ({
      doc: id => docRef(c, id || mintId()),
      async add(data){ const ref = docRef(c, mintId()); await ref.set(data); return ref; },
      onSnapshot(next, error){
        if (!listeners.has(c)) listeners.set(c, new Set());
        listeners.get(c).add(next); if (error) errHandlers.add(error);
        if (loaded) next(snap(c));
        return () => listeners.get(c).delete(next);
      }
    }),
    doc: path => { const i = path.indexOf('/'); return docRef(path.slice(0, i), path.slice(i + 1)); },
    async checkPassword(pw){ const r = check(await client.rpc('check_board_password', { pw })); return r.data === true; },
    async setPassword(oldPw, newPw){ const r = check(await client.rpc('set_board_password', { old_pw: oldPw, new_pw: newPw })); return r.data === true; }
  };
}


const PW_SALT = '6-2반-경고:';
const DEFAULT_PW_HASH = '4fea21c173d92c61a62c2d56a3082371674da83efaa6d147624cc1778c1a220b'; // '0000'
async function hashPw(pw){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(PW_SALT + pw));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPw(pw){
  try {
    if (state.db && !state.local) return await state.db.checkPassword(pw);   // Supabase가 확인 (비밀번호는 페이지에 없음)
    return (await hashPw(pw)) === (state.pwHash || DEFAULT_PW_HASH);
  } catch (e) { console.error(e); return false; }
}
const SEEN_KEY = 'class-notice-seen';
const CLEARED_KEY = 'class-notice-cleared';
const PERM_KEY = 'class-permission-holder';
const THEME_KEY = 'class-theme-mode';

const state = { students: [], warnings: [], holders: [], appeals: [], notices: [], pwHash: null, loaded: 0, db: null, local: false, holderId: null, openId: null, view: null, confirm: null };

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
state.holderId = store.get(PERM_KEY);

/* ---------- helpers (원본 classHelpers 로직) ---------- */
const active = ws => ws.filter(w => !w.resolved);
const resolved = ws => ws.filter(w => w.resolved);
const hanjaCount = ws => Math.floor(active(ws).length / 2);
/* 한자 상태
   - 내준 한자: hanja_id가 같은 남은 경고 2개가 한 묶음 (숙제로 내준 것)
   - 내줄 한자: 아직 묶이지 않은 남은 경고 2개마다 1개
   - 묶음 중 하나가 지워져 짝이 깨지면 남은 경고는 다시 '안 내줌'으로 본다 */
function hanjaState(ws){
  const act = oldest(active(ws));
  const groups = new Map();
  act.forEach(w => { if (w.hanja_id){ if (!groups.has(w.hanja_id)) groups.set(w.hanja_id, []); groups.get(w.hanja_id).push(w); } });
  const assignedGroups = [...groups.values()].filter(g => g.length >= 2).map(g => g.slice(0, 2))
    .sort((x, y) => new Date(x[0].assigned_at || x[0].created_at) - new Date(y[0].assigned_at || y[0].created_at));
  const inGroup = new Set(assignedGroups.flat().map(w => w.id));
  const free = act.filter(w => !inGroup.has(w.id));
  return { assignedGroups, free, assigned: assignedGroups.length, toAssign: Math.floor(free.length / 2), total: Math.floor(act.length / 2) };
}
const newest = ws => [...ws].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
const oldest = ws => [...ws].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
function fmt(v){
  if (!v) return '-'; const d = new Date(v); if (isNaN(d)) return '-';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const warningsOf = id => state.warnings.filter(w => w.student_id === id);
const authorized = () => state.holderId && state.holders.some(h => h.id === state.holderId);
const holderName = () => state.holders.find(h => h.id === state.holderId)?.name ?? null;

let toastTimer;
function toast(msg, undo){
  const t = document.getElementById('toast'); clearTimeout(toastTimer);
  t.textContent = '';
  const span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
  if (undo){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'undo'; b.textContent = '되돌리기';
    b.onclick = () => { t.hidden = true; clearTimeout(toastTimer); run(undo, '되돌렸어요'); };
    t.appendChild(b);
  }
  t.hidden = false;
  toastTimer = setTimeout(() => t.hidden = true, undo ? 6000 : 2200);
}

/* ---------- theme (원본 useTheme) ---------- */
const root = document.documentElement;
const curTheme = () => root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function applyTheme(mode){ root.setAttribute('data-theme', mode); store.set(THEME_KEY, mode); }
const savedTheme = store.get(THEME_KEY);
if (savedTheme) applyTheme(savedTheme);

/* ---------- data layer (원본 useClassData → artifact db) ---------- */
const now = () => new Date().toISOString();
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const api = {
  async addStudent(name){ const d = { name, created_at: now() }; if (state.local) return localAdd('students', d); await state.db.collection('students').add(d); },
  async deleteWarning(wid){
    const w = state.warnings.find(x => x.id === wid); if (!w) return;
    state.warnings = state.warnings.filter(x => x.id !== wid); render();
    if (!state.local) await state.db.doc('warnings/' + wid).delete();
    const noticeId = await api.addNotice(w, 'trash');
    // 되돌리기: 같은 id로 경고를 다시 만들고, 방금 보낸 삭제 알림을 지운다
    return async () => {
      const { id, ...body } = w;
      state.warnings = [...state.warnings, w]; state.notices = state.notices.filter(n => n.id !== noticeId); render();
      if (state.local) return;
      await Promise.all([state.db.doc('warnings/' + id).set(body), noticeId ? state.db.doc('notices/' + noticeId).delete() : null]);
    };
  },
  async addGivenNotice(sid, reason, count, given_by){
    const s = state.students.find(x => x.id === sid);
    const d = { kind: 'warning_given', student_name: s?.name ?? '학생', reason, count, given_by, created_at: now() };
    if (state.local){ const id = newId(); state.notices.push({ id, ...d }); render(); return id; }
    const ref = await state.db.collection('notices').add(d); return ref.id;
  },
  async addNotice(w, via){
    const s = state.students.find(x => x.id === w.student_id);
    const d = { kind: 'warning_deleted', via, student_name: s?.name ?? '학생', reason: w.reason, warned_at: w.created_at, created_at: now() };
    if (state.local){ const id = newId(); state.notices.push({ id, ...d }); render(); return id; }
    const ref = await state.db.collection('notices').add(d); return ref.id;
  },
  async setPassword(pw, curPw){
    if (state.local){ state.pwHash = await hashPw(pw); return; }
    const ok = await state.db.setPassword(curPw, pw);
    if (!ok) throw new Error('비밀번호를 바꾸지 못했어요.');
  },
  async addAppeal(wid, appellant, content){
    const d = { warning_id: wid, appellant, content, status: 'pending', created_at: now(), decided_at: null };
    if (state.local){ state.appeals.push({ id: newId(), ...d }); return render(); }
    await state.db.collection('appeals').add(d);
  },
  async resolveAppeal(aid, accept){
    const a = state.appeals.find(x => x.id === aid); if (!a) return;
    const patch = { status: accept ? 'accepted' : 'rejected', decided_at: now() };
    state.appeals = state.appeals.map(x => x.id === aid ? { ...x, ...patch } : x);
    const w = state.warnings.find(x => x.id === a.warning_id);
    if (accept) state.warnings = state.warnings.filter(x => x.id !== a.warning_id);
    render();
    if (state.local){ if (accept && w) localNotice(w, 'appeal'); return; }
    await Promise.all([
      state.db.doc('appeals/' + aid).update(patch),
      ...(accept ? [state.db.doc('warnings/' + a.warning_id).delete()] : [])
    ]);
    if (accept && w) await api.addNotice(w, 'appeal');
  },
  async renameStudent(id, name){
    state.students = state.students.map(s => s.id === id ? { ...s, name } : s); render();
    if (state.local) return;
    await state.db.doc('students/' + id).update({ name });
  },
  async deleteStudent(id){
    const ws = warningsOf(id);
    if (state.local){ state.students = state.students.filter(s => s.id !== id); state.warnings = state.warnings.filter(w => w.student_id !== id); return render(); }
    state.students = state.students.filter(s => s.id !== id); state.warnings = state.warnings.filter(w => w.student_id !== id); render();
    await Promise.all([...ws.map(w => state.db.doc('warnings/' + w.id).delete()), state.db.doc('students/' + id).delete()]);
  },
  async addWarning(sid, reason, count = 1){
    const base = Date.now();
    // 같은 사유를 count개 기록 (순서가 섞이지 않게 1ms씩 차이를 둠)
    const given_by = holderName() || '';
    const docs = Array.from({ length: count }, (_, i) => ({ id: state.local ? newId() : state.db.collection('warnings').doc().id, student_id: sid, reason, given_by, resolved: false, created_at: new Date(base + i).toISOString(), resolved_at: null }));
    const ids = new Set(docs.map(d => d.id));
    state.warnings = [...state.warnings, ...docs]; render();
    if (!state.local) await Promise.all(docs.map(({ id, ...body }) => state.db.doc('warnings/' + id).set(body)));
    const noticeId = await api.addGivenNotice(sid, reason, count, given_by);
    // 되돌리기: 경고와 함께 방금 보낸 알림도 지운다
    return async () => {
      state.warnings = state.warnings.filter(w => !ids.has(w.id)); state.notices = state.notices.filter(n => n.id !== noticeId); render();
      if (state.local) return;
      await Promise.all([...[...ids].map(id => state.db.doc('warnings/' + id).delete()), noticeId ? state.db.doc('notices/' + noticeId).delete() : null]);
    };
  },
  async resolve(targets){
    const t = now(); const ids = new Set(targets.map(w => w.id));
    // 화면에서 바로 반영하고, 저장은 동시에 보낸다
    state.warnings = state.warnings.map(w => ids.has(w.id) ? { ...w, resolved: true, resolved_at: t } : w);
    render();
    if (!state.local) await Promise.all(targets.map(w => state.db.doc('warnings/' + w.id).update({ resolved: true, resolved_at: t })));
    return async () => {
      state.warnings = state.warnings.map(w => ids.has(w.id) ? { ...w, resolved: false, resolved_at: null } : w); render();
      if (state.local) return;
      await Promise.all([...ids].map(id => state.db.doc('warnings/' + id).update({ resolved: false, resolved_at: null })));
    };
  },
  // 한자 내주기: 묶이지 않은 오래된 경고 2개씩 묶어 숙제로 표시
  async assignHanja(sid, all){
    const st = hanjaState(warningsOf(sid));
    const n = all ? st.toAssign : Math.min(1, st.toAssign);
    if (!n) throw new Error('내줄 한자가 없어요. 경고가 2개 모여야 한자 1개예요.');
    const t = now(); const updates = new Map();
    for (let i = 0; i < n; i++){
      const hid = newId();
      st.free.slice(i * 2, i * 2 + 2).forEach(w => updates.set(w.id, { hanja_id: hid, assigned_at: t }));
    }
    state.warnings = state.warnings.map(w => updates.has(w.id) ? { ...w, ...updates.get(w.id) } : w);
    render();
    if (!state.local) await Promise.all([...updates].map(([id, patch]) => state.db.doc('warnings/' + id).update(patch)));
    return async () => {
      const clear = { hanja_id: null, assigned_at: null };
      state.warnings = state.warnings.map(w => updates.has(w.id) ? { ...w, ...clear } : w); render();
      if (state.local) return;
      await Promise.all([...updates.keys()].map(id => state.db.doc('warnings/' + id).update(clear)));
    };
  },
  // 한자 해옴: 내준 한자 묶음을 완료 처리 (경고 2개가 지워짐)
  async doneHanja(sid, all){
    const st = hanjaState(warningsOf(sid));
    if (!st.assigned) throw new Error('내준 한자가 없어요. 먼저 ‘한자 내주기’를 눌러 주세요.');
    const groups = all ? st.assignedGroups : st.assignedGroups.slice(0, 1);
    return api.resolve(groups.flat());
  },
  async deleteResolvedWarnings(sid){
    const ws = resolved(warningsOf(sid)); const ids = new Set(ws.map(w => w.id));
    state.warnings = state.warnings.filter(w => !ids.has(w.id)); render();
    if (state.local) return;
    await Promise.all(ws.map(w => state.db.doc('warnings/' + w.id).delete()));
  },
  async deleteAllWarnings(sid){
    if (state.local){ state.warnings = state.warnings.filter(w => w.student_id !== sid); return render(); }
    const ws = warningsOf(sid); state.warnings = state.warnings.filter(w => w.student_id !== sid); render();
    await Promise.all(ws.map(w => state.db.doc('warnings/' + w.id).delete()));
  },
  async addHolder(name){
    const d = { name, created_at: now() };
    if (state.local){ const id = newId(); state.holders.push({ id, ...d }); render(); return id; }
    const ref = await state.db.collection('permission_holders').add(d); return ref.id;
  },
  async removeHolder(id){
    if (state.local){ state.holders = state.holders.filter(h => h.id !== id); return render(); }
    await state.db.doc('permission_holders/' + id).delete();
  }
};
function localNotice(w, via){ api.addNotice(w, via); }
function localAdd(col, d){ state[col === 'permission_holders' ? 'holders' : col].push({ id: newId(), ...d }); render(); }

let busy = false;
async function run(fn, okMsg){
  if (busy) return; busy = true;
  try { const undo = await fn(); if (okMsg) toast(okMsg, typeof undo === 'function' ? undo : null); }
  catch (e){ console.error(e); toast(e?.message && !e.code ? e.message : '저장하지 못했어요. 권한이나 연결을 확인하고 다시 시도해 주세요.'); }
  finally { busy = false; }
}

/* ---------- permission ---------- */
function grant(id){ state.holderId = id; store.set(PERM_KEY, id); render(); }
function release(){ state.holderId = null; store.del(PERM_KEY); render(); }

/* ---------- render ---------- */
function render(){
  const ready = state.local || state.loaded >= 3;
  if (ready && state.holderId && !state.holders.some(h => h.id === state.holderId)) { state.holderId = null; store.del(PERM_KEY); }
  const auth = authorized();
  const perm = document.getElementById('perm');
  perm.textContent = auth ? `${holderName()} 관리 중` : '보기 전용';
  perm.classList.toggle('on', !!auth);
  const badge = document.getElementById('bellBadge'); const pc = (auth ? pendingAppeals().length : 0) + unseenNotices().length;
  badge.hidden = !pc; badge.textContent = pc > 99 ? '99+' : String(pc);
  document.getElementById('bellBtn').setAttribute('aria-label', pc ? `알림 ${pc}개` : '알림');

  const st = document.getElementById('status');
  if (state.local){ st.hidden = false; st.className = 'notice'; st.textContent = '저장소에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요. 지금 바꾼 내용은 저장되지 않아요.'; }
  else if (!ready){ st.hidden = false; st.className = 'notice'; st.textContent = '학생 명단을 불러오는 중이에요…'; }
  else st.hidden = true;

  const grid = document.getElementById('grid');
  const all = [...state.students].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  const hwCount = all.filter(s => hanjaState(warningsOf(s.id)).assigned > 0).length;
  const list = state.filter === 'hw' ? all.filter(s => hanjaState(warningsOf(s.id)).assigned > 0) : all;
  document.querySelector('.viewtabs').classList.toggle('hw', state.filter === 'hw');
  document.getElementById('tabAll').setAttribute('aria-selected', state.filter !== 'hw');
  document.getElementById('tabAll').textContent = `전체 학생 ${all.length}`;
  document.getElementById('tabHw').setAttribute('aria-selected', state.filter === 'hw');
  document.getElementById('tabHw').textContent = `숙제 중인 학생 ${hwCount}`;
  const empty = document.getElementById('empty');
  empty.hidden = !(ready && list.length === 0);
  empty.textContent = state.filter === 'hw' && all.length ? '지금 숙제 중인 학생이 없어요.' : '아직 학생이 없어요. 오른쪽 위 설정에서 관리 권한을 받은 뒤 첫 학생을 추가하세요.';
  grid.innerHTML = list.map(s => {
    const ws = warningsOf(s.id); const a = active(ws).length; const hs = hanjaState(ws); const h = hs.toAssign;
    return `<button class="card${h || hs.assigned ? ' hot' : ''}" data-id="${esc(s.id)}" type="button">
      <span class="name">${esc(s.name)}</span>
      ${hs.assigned ? `<span class="hw">숙제 중 ${hs.assigned}</span>` : ''}
      <span class="marks"><span class="hanja${h ? '' : ' zero'}" title="내줄 한자">${h}</span>
        <span class="dots" aria-label="경고 ${a}개">${'<i class="dot"></i>'.repeat(Math.min(a,12))}${a>12?'+':''}${a===0?'경고 없음':''}</span></span>
    </button>`;
  }).join('');
  renderModal();
}

});

/* ---------- 이의 제기 ---------- */
// 경고가 아직 남아 있는 대기 중 이의만 알림으로 센다
const pendingAppeals = () => state.appeals
  .filter(a => a.status === 'pending' && state.warnings.some(w => w.id === a.warning_id && !w.resolved))
  .sort((x,y) => new Date(y.created_at) - new Date(x.created_at));
const pendingFor = wid => pendingAppeals().some(a => a.warning_id === wid);

const tsOf = k => { const v = store.get(k); return v ? new Date(v).getTime() : 0; };
const visibleNotices = () => state.notices
  .filter(n => new Date(n.created_at).getTime() > tsOf(CLEARED_KEY))
  .sort((x,y) => new Date(y.created_at) - new Date(x.created_at)).slice(0, 50);
const unseenNotices = () => visibleNotices().filter(n => new Date(n.created_at).getTime() > tsOf(SEEN_KEY));

function noticeText(n){
  if (n.kind === 'warning_given')
    return `<span class="ntag give">경고</span><b>${esc(n.student_name)}</b> 학생이 ‘${esc(n.reason)}’ 경고 ${Number(n.count) || 1}개를 받았어요.${n.given_by ? `<small class="by">${esc(n.given_by)}</small>` : ''}`;
  return `<span class="ntag del">삭제</span><b>${esc(n.student_name)}</b> 학생의 ‘${esc(n.reason)}’ 경고가 ${n.via === 'appeal' ? '이의 제기로 ' : ''}지워졌어요.`;
}

function bellHTML(){
  const auth = authorized();
  const head = `<div class="mhead"><div><h2>알림</h2><p class="sub">${auth ? '이의 제기와 경고 소식이에요.' : '경고를 주고 지운 소식이에요.'}</p></div><button class="x" data-act="close" aria-label="닫기">닫기</button></div>`;
  const appeals = auth ? pendingAppeals() : [];
  const notices = visibleNotices();

function renderModal(){

  if (!state.view){ rootEl.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  const keep = document.activeElement?.id; const keepVal = {};
  rootEl.querySelectorAll('input,textarea').forEach(i => keepVal[i.id] = i.value);
  const main = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true">${state.view === 'perm' ? permHTML() : state.view === 'app' ? appHTML() : state.view === 'students' ? studentsHTML() : state.view === 'bell' ? bellHTML() : state.view === 'pw' ? pwHTML() : studentHTML()}</div></div>`;
  let subHTML = '';
  if (state.view === 'student' && state.sub === 'settings') subHTML = settingsHTML();
  if (state.view === 'student' && state.sub === 'appeal') subHTML = appealFormHTML();
  if (state.view === 'student' && state.sub === 'warnCount') subHTML = warnCountHTML();
  if (state.view === 'bell' && state.sub === 'appealDetail') subHTML = appealDetailHTML();
  const sub = subHTML ? `<div class="scrim top" data-close="sub"><div class="modal small" role="dialog" aria-modal="true">${subHTML}</div></div>` : '';
  rootEl.innerHTML = main + sub;
  rootEl.querySelectorAll('input,textarea').forEach(i => { if (keepVal[i.id] != null) i.value = keepVal[i.id]; });

}

const modalRoot = document.getElementById('modalRoot');
modalRoot.addEventListener('click', e => {
  if (e.target.dataset.close === 'sub') return closeSub();
  if (e.target.dataset.close) return close();
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, sid = state.openId;
  const s = state.students.find(x => x.id === sid);
  switch (act){
    case 'close': return close();
    case 'toPerm': state.view = 'perm'; state.confirm = null; return render();
    case 'toApp': state.view = 'app'; state.confirm = null; state.editId = null; return render();
    case 'toStudents': state.view = 'students'; state.editId = null; return render();
    case 'edit': { state.editId = b.dataset.id; render(); const i = document.getElementById('edit-' + b.dataset.id); if (i){ i.focus(); i.select(); } return; }
    case 'cancelEdit': state.editId = null; return render();
    case 'theme': applyTheme(b.dataset.mode); return render();
    case 'toPw': state.view = 'pw'; return render();
    case 'warnCount': {
      const n = Number(b.dataset.n), reason = state.pendingWarn?.reason; if (!reason) return;
      state.pendingWarn = null; state.sub = null; const i = document.getElementById('reason'); if (i) i.value = '';
      render();
      return run(() => api.addWarning(sid, reason, n), `‘${reason}’ 경고 ${n}개를 기록했어요`);
    }
    case 'warnCancel': return closeSub();
    case 'clearNotices': store.set(CLEARED_KEY, now()); store.set(SEEN_KEY, now()); render(); return toast('알림을 모두 지웠어요');
    case 'settings': state.sub = 'settings'; state.confirm = null; return render();
    case 'appeal': state.sub = 'appeal'; state.appealWarningId = b.dataset.w; render(); document.getElementById('apName')?.focus(); return;
    case 'delWarn': return run(() => api.deleteWarning(b.dataset.w), '경고를 삭제했어요');
    case 'openAppeal': state.sub = 'appealDetail'; state.appealId = b.dataset.a; return render();
    case 'acceptAppeal': { const id = state.appealId; closeSub(); return run(() => api.resolveAppeal(id, true), '수락했어요. 경고를 삭제했어요'); }
    case 'rejectAppeal': { const id = state.appealId; closeSub(); return run(() => api.resolveAppeal(id, false), '거절했어요'); }
    case 'closeSub': return closeSub();
    case 'assign1': return run(() => api.assignHanja(sid, false), '한자 1개를 내줬어요');
    case 'assignAll': return run(() => api.assignHanja(sid, true), '한자를 모두 내줬어요');
    case 'done1': return run(() => api.doneHanja(sid, false), '한자 1개를 해 왔어요. 경고 2개가 지워졌어요');
    case 'doneAll': return run(() => api.doneHanja(sid, true), '내준 한자를 모두 해 왔어요');
    case 'askClearDone': state.confirmDone = true; return render();
    case 'clearDoneNo': state.confirmDone = false; return render();
    case 'clearDoneYes': state.confirmDone = false; return run(() => api.deleteResolvedWarnings(sid), '완료한 경고 기록을 지웠어요');
    case 'askClear': state.confirm = { label: `${s.name} 학생의 경고 기록을 모두 지울까요? 되돌릴 수 없어요.`, fn: async () => { await run(() => api.deleteAllWarnings(sid), '경고 기록을 지웠어요'); closeSub(); } }; return render();
    case 'askDel': state.confirm = { needPw: true, label: `${s.name} 학생과 모든 기록을 삭제하려면 비밀번호를 한 번 더 입력하세요.`, fn: async () => { await run(() => api.deleteStudent(sid), '학생을 삭제했어요'); close(); } }; return render();
    case 'askRm': { const h = state.holders.find(x => x.id === b.dataset.h); state.confirm = { label: `${h.name}의 관리 권한을 해제할까요?`, fn: () => run(() => api.removeHolder(h.id), '권한을 해제했어요') }; return render(); }
    case 'yes': {
      const go = () => { const f = state.confirm?.fn; state.confirm = null; render(); return f && f(); };
      if (state.confirm?.needPw){
        const pw = document.getElementById('delPw');
        checkPw(pw ? pw.value : '').then(ok => {
          if (ok) return go();
          document.getElementById('delPwErr').hidden = false; const p = document.getElementById('delPw'); if (p){ p.value = ''; p.focus(); }
        });
        return;
      }
      return go(); }
    case 'no': state.confirm = null; return render();
    case 'release': release(); return toast('이 기기의 관리 권한을 내려놓았어요');
  }
});
modalRoot.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'appeal'){
    const name = document.getElementById('apName').value.trim();
    const text = document.getElementById('apText').value.trim();
    if (!name){ toast('이름을 입력해 주세요'); return; }
    if (!text){ toast('이의 내용을 입력해 주세요'); return; }
    const wid = state.appealWarningId; closeSub();
    return run(() => api.addAppeal(wid, name, text), '이의 제기를 보냈어요. 관리자가 확인할 거예요');
  }
  if (f === 'rename'){
    const id = e.target.dataset.id; const n = document.getElementById('edit-' + id).value.trim();
    const cur = state.students.find(s => s.id === id);
    if (!n){ toast('이름을 입력해 주세요'); return; }
    state.editId = null;
    if (!cur || cur.name === n) return render();
    return run(() => api.renameStudent(id, n), `이름을 ${n}(으)로 바꿨어요`);
  }
  if (f === 'add'){
    const i = document.getElementById('newName'); const n = i.value.trim(); if (!n) return;
    i.value = ''; run(() => api.addStudent(n), `${n} 학생을 추가했어요`);
  }
  if (f === 'warn'){
    const i = document.getElementById('reason'); const reason = i.value.trim() || '사유 없음';
    state.pendingWarn = { reason }; state.sub = 'warnCount'; render();
  }
  if (f === 'grant'){
    const name = document.getElementById('holderName').value.trim();
    const pw = document.getElementById('pw').value;
    if (!name){ toast('관리자 이름을 입력해 주세요'); return; }
    checkPw(pw).then(ok => {
      if (!ok){ const el = document.getElementById('pwErr'); if (el) el.hidden = false; return; }
      const existing = state.holders.find(h => (h.name || '').trim() === name);
      if (existing){ grant(existing.id); toast(`${name} 관리자로 로그인했어요`); return; }
      run(async () => { const id = await api.addHolder(name); if (id) grant(id); }, `${name} 이름으로 권한을 받았어요`);
    });
  }
  if (f === 'pwChange'){
    const cur = document.getElementById('pwCur').value, n1 = document.getElementById('pwNew').value, n2 = document.getElementById('pwNew2').value;
    const err = m => { const el = document.getElementById('pwChErr'); el.textContent = m; el.hidden = false; };
    if (n1.length < 4) return err('새 비밀번호는 4자 이상으로 정해 주세요.');
    if (n1 !== n2) return err('새 비밀번호 두 칸이 서로 달라요.');
    checkPw(cur).then(async ok => {
      if (!ok) return err('지금 비밀번호가 맞지 않아요.');
      try { await api.setPassword(n1, cur); state.view = 'app'; render(); toast('비밀번호를 바꿨어요'); }
      catch (e){ console.error(e); err('비밀번호를 저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.'); }
    });
  }
});

/* ---------- boot ---------- */
render();
(async () => {
  let db = null;
  try { db = makeSupabaseDb(); } catch (e) { console.error(e); }
  if (!db){ state.local = true; return render(); }
  state.db = db;
  const map = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const onErr = e => { console.error(e); const st = document.getElementById('status'); st.hidden = false; st.className = 'notice err'; st.textContent = '데이터를 불러오지 못했어요. Supabase 설정(SQL 실행)이 끝났는지 확인하고 새로고침해 주세요.'; };
  const seen = new Set();
  const mark = k => { if (!seen.has(k)){ seen.add(k); state.loaded++; } };
  db.collection('students').onSnapshot(s => { state.students = map(s); mark('s'); render(); }, onErr);
  db.collection('warnings').onSnapshot(s => { state.warnings = map(s); mark('w'); render(); }, onErr);
  db.collection('permission_holders').onSnapshot(s => { state.holders = map(s); mark('h'); render(); }, onErr);
  db.collection('appeals').onSnapshot(s => { state.appeals = map(s); render(); }, onErr);
  db.collection('notices').onSnapshot(s => { state.notices = map(s); render(); }, onErr);
})();
})();
</script>
